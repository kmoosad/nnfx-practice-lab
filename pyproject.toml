[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nnfx-practice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4"]

[tool.setuptools]
packages = ["nnfx_practice", "strategies", "strategies.t3_bandpass_v1"]

[tool.setuptools.package-data]
nnfx_practice = ["schema.sql", "schema_m07.sql", "templates/*.html", "templates/*.css"]
"strategies.t3_bandpass_v1" = ["manifest.json", "qualification.json"]
